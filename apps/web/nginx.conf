# Apply immutable caching only to successful hashed-asset responses. Keep the
# headers at server scope so location blocks inherit all security headers.
map "$uri:$status" $asset_cache_control {
  default "";
  ~^/assets/.*:(200|206|304)$ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 128m;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Cache-Control $asset_cache_control;

  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  location /api/ {
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the public edge: discard client-supplied forwarding chains.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_buffering off;
    client_body_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location = /metrics { return 404; }

  location /healthz {
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream/healthz;
  }

  location = /openapi.json {
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream/openapi.json;
  }

  location /assets/ {
    try_files $uri =404;
  }

  # PDF.js ships an ES module worker. Nginx's stock MIME map only lists .js;
  # module workers require a JavaScript media type and cannot use octet-stream.
  location ~ ^/assets/.*\.mjs$ {
    types { application/javascript mjs; }
    try_files $uri =404;
  }

  location ~ /\. {
    return 404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
