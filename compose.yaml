name: school-oj

x-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    mem_limit: 768m
    cpus: "1.5"
    pids_limit: 256
    restart: unless-stopped
    logging: *service-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-oj}"
      POSTGRES_USER: "${POSTGRES_USER:-oj}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 128
    restart: unless-stopped
    logging: *service-logging
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    command: ["sh", "-ec", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 256
    restart: unless-stopped
    logging: *service-logging
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
    volumes:
      - minio-data:/data

  api:
    mem_limit: 1g
    cpus: "2.0"
    pids_limit: 256
    restart: unless-stopped
    logging: *service-logging
    build:
      context: ./apps/api
    environment:
      APP_ADDR: ":8080"
      GIN_MODE: "release"
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-oj} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set} dbname=${POSTGRES_DB:-oj} port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      REDIS_DB: "${REDIS_DB:-0}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
      MINIO_BUCKET: "${MINIO_BUCKET:-oj-artifacts}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,172.16.0.0/12}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-no-reply@huanghailuoj.local}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-黄海在线}"
      AUTO_MIGRATE: "false"
      SEED_DATA: "${SEED_DATA:-false}"
      JPLAG_WORK_DIR: "${JPLAG_WORK_DIR:-/tmp/jplag}"
      JPLAG_JAR_PATH: "${JPLAG_JAR_PATH:-}"
      REQUEST_TIMEOUT_SECONDS: "${REQUEST_TIMEOUT_SECONDS:-30}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "/usr/local/bin/api-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 20

  worker:
    mem_limit: 768m
    cpus: "1.5"
    pids_limit: 256
    restart: unless-stopped
    logging: *service-logging
    build:
      context: ./apps/worker
    environment:
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-oj} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set} dbname=${POSTGRES_DB:-oj} port=5432 sslmode=disable TimeZone=Asia/Shanghai"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
      REDIS_DB: "${REDIS_DB:-0}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}"
      MINIO_SECRET_KEY: "${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}"
      MINIO_BUCKET: "${MINIO_BUCKET:-oj-artifacts}"
      SANDBOX_WORK_ROOT: "${OJ_WORK_ROOT:-/var/lib/school-oj-worker}"
      DOCKER_SANDBOX_SECCOMP: "${OJ_WORK_ROOT:-/var/lib/school-oj-worker}/seccomp/oj-seccomp.json"
      SANDBOX_CPU: "${SANDBOX_CPU:-1.0}"
      SANDBOX_MEMORY_MB: "${SANDBOX_MEMORY_MB:-256}"
      SANDBOX_PIDS: "${SANDBOX_PIDS:-128}"
      SUBMISSION_TIMEOUT_SECONDS: "${SUBMISSION_TIMEOUT_SECONDS:-300}"
      SUBMISSION_GROUP: "${SUBMISSION_GROUP:-judge-workers}"
      SUBMISSION_MAX_RETRIES: "${SUBMISSION_MAX_RETRIES:-3}"
      SUBMISSION_RETRY_IDLE_SECONDS: "${SUBMISSION_RETRY_IDLE_SECONDS:-60}"
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "worker", "--healthcheck"]
      start_period: 15m
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${OJ_WORK_ROOT:-/var/lib/school-oj-worker}:${OJ_WORK_ROOT:-/var/lib/school-oj-worker}:z"

  web:
    mem_limit: 128m
    cpus: "0.5"
    pids_limit: 128
    restart: unless-stopped
    logging: *service-logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-25565}:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
